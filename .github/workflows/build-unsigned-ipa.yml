name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, fix/korean-complete-audit]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ github.ref == 'refs/heads/main' && 'macos-15-intel' || 'ubuntu-latest' }}
    env:
      DEVELOPER_DIR: ${{ github.ref == 'refs/heads/main' && '/Applications/Xcode_26.3.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify selected Apple toolchain
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch upstream source
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/exult/exult.git
          git -C upstream fetch --depth 1 origin 717ef59d14a5c7e43418d0f669a4caa5c8ab27a3
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream rev-parse HEAD

      - name: Apply Korean renderer patch
        working-directory: upstream
        run: |
          git apply --check ../patches/legacy-korean-font.patch
          git apply ../patches/legacy-korean-font.patch

      - name: Apply iOS device diagnostics
        run: python3 tools/apply_ios_diagnostics.py

      - name: Test production Korean font loader with synthetic data
        run: |
          python3 tests/test_korean_font.py
          python3 tests/test_korean_colour.py
          python3 tests/test_korean_encoding.py
          python3 tests/test_korean_paths.py
          python3 tests/test_ios_lifecycle.py
          python3 tests/test_menu_layers.py

      - name: Upload encoding audit report
        uses: actions/upload-artifact@v4
        with:
          name: korean-encoding-audit
          path: korean-audit.json

      - name: Fetch pinned iOS dependencies
        if: github.ref == 'refs/heads/main'
        working-directory: upstream
        run: >-
          xcodebuild build -scheme git_clone_release_dependencies
          -project ios/Exult.xcodeproj
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO

      - name: Record dependency revisions
        if: github.ref == 'refs/heads/main'
        run: |
          git -C upstream rev-parse HEAD
          find upstream -name .git -type d -print

      - name: Build unsigned app bundle
        if: github.ref == 'refs/heads/main'
        working-directory: upstream
        run: >-
          xcodebuild build -scheme Exult -configuration Release -sdk iphoneos
          -project ios/Exult.xcodeproj -derivedDataPath "$GITHUB_WORKSPACE/build"
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Exult.app ipa/Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Ultima VII" ipa/Payload/Exult.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Ultima VII" ipa/Payload/Exult.app/Info.plist
          ditto -c -k --sequesterRsrc --keepParent ipa/Payload Exult-korean-engine-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: Exult-korean-engine-unsigned
          path: Exult-korean-engine-unsigned.ipa
