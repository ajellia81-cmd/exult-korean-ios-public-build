name: build-unsigned-ipa
# Fresh consolidated build requested by user.

on:
  workflow_dispatch:
  push:
    branches: [main, fix/korean-complete-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.ref == 'refs/heads/main' && 'macos-15-intel' || 'ubuntu-latest' }}
    env:
      DEVELOPER_DIR: ${{ github.ref == 'refs/heads/main' && '/Applications/Xcode_26.3.app/Contents/Developer' || '' }}
    steps:
      - name: Cancel superseded builds
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/workflows/build-unsigned-ipa.yml/runs?per_page=100" --jq '.workflow_runs[] | select(.status != "completed") | .id' |
          while read -r previous_run; do
            if [ "$previous_run" != "$GITHUB_RUN_ID" ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$previous_run/cancel"
            fi
          done

      - uses: actions/checkout@v6

      - name: Verify selected Apple toolchain
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Load audited release baseline
        run: cp tools/release_baseline.json previous-ipa-inventory.json

      - name: Fetch upstream source
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/exult/exult.git
          git -C upstream fetch --depth 1 origin 717ef59d14a5c7e43418d0f669a4caa5c8ab27a3
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream rev-parse HEAD

      - name: Apply Korean renderer patch
        working-directory: upstream
        run: |
          git apply --check ../patches/legacy-korean-font.patch
          git apply ../patches/legacy-korean-font.patch

      - name: Apply audited Korean and iOS fixes
        run: |
          python3 tools/apply_ios_diagnostics.py
          python3 tools/apply_native_korean.py
          python3 tools/apply_korean_completion.py
          python3 tools/apply_korean_followup.py
          python3 tools/apply_korean_cinematics.py
          python3 tools/apply_korean_names.py
          python3 tools/apply_release_cleanup.py

      - name: Test production Korean font loader with synthetic data
        run: |
          python3 tests/test_korean_font.py
          python3 tests/test_korean_colour.py
          python3 tests/test_korean_encoding.py
          python3 tests/test_korean_paths.py
          python3 tests/test_ios_lifecycle.py
          python3 tests/test_menu_layers.py
          python3 tests/test_native_korean.py
          python3 tests/test_startup_regressions.py
          python3 tests/test_korean_completion.py
          python3 tests/test_korean_followup.py
          python3 tests/test_korean_cinematics.py
          python3 tests/test_korean_names.py
          python3 tests/test_release_cleanup.py

      - name: Upload encoding audit report
        uses: actions/upload-artifact@v4
        with:
          name: korean-encoding-audit
          path: |
            korean-audit.json
            previous-ipa-inventory.json

      - name: Fetch pinned iOS dependencies
        if: github.ref == 'refs/heads/main'
        working-directory: upstream
        run: >-
          xcodebuild build -scheme git_clone_release_dependencies
          -project ios/Exult.xcodeproj -configuration Release
          -derivedDataPath "$GITHUB_WORKSPACE/build"
          GCC_GENERATE_DEBUGGING_SYMBOLS=NO GCC_OPTIMIZATION_LEVEL=s
          DEAD_CODE_STRIPPING=YES ENABLE_TESTABILITY=NO MTL_ENABLE_DEBUG_INFO=NO
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO

      - name: Record dependency revisions
        if: github.ref == 'refs/heads/main'
        run: |
          git -C upstream rev-parse HEAD
          find upstream -name .git -type d -print

      - name: Build unsigned app bundle
        if: github.ref == 'refs/heads/main'
        working-directory: upstream
        run: >-
          xcodebuild build -scheme Exult -configuration Release -sdk iphoneos
          -project ios/Exult.xcodeproj -derivedDataPath "$GITHUB_WORKSPACE/build"
          GCC_GENERATE_DEBUGGING_SYMBOLS=NO GCC_OPTIMIZATION_LEVEL=s
          DEAD_CODE_STRIPPING=YES ENABLE_TESTABILITY=NO MTL_ENABLE_DEBUG_INFO=NO
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO

      - name: Package and audit compact production IPA
        if: github.ref == 'refs/heads/main'
        run: |
          python3 tools/package_release.py build/Build/Products/Release-iphoneos/Exult.app Exult-korean-release-unsigned.ipa tools/release_baseline.json

      - name: Upload release package audit
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-audit
          path: release-package-audit.json

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: Exult-korean-release-unsigned
          path: Exult-korean-release-unsigned.ipa
